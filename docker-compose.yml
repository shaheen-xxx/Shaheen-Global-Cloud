version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shaheen-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shaheen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shaheen_password}
      POSTGRES_DB: ${POSTGRES_DB:-shaheen_cloud}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shaheen}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shaheen-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shaheen-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shaheen}:${POSTGRES_PASSWORD:-shaheen_password}@postgres:5432/${POSTGRES_DB:-shaheen_cloud}
      REDIS_URL: redis://redis:6379/0
      FASTAPI_ENV: ${FASTAPI_ENV:-development}
      FASTAPI_DEBUG: ${FASTAPI_DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DAGGER_WORKDIR: ${DAGGER_WORKDIR:-/tmp/dagger-work}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /tmp/dagger-work:/tmp/dagger-work
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shaheen-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shaheen}:${POSTGRES_PASSWORD:-shaheen_password}@postgres:5432/${POSTGRES_DB:-shaheen_cloud}
      REDIS_URL: redis://redis:6379/0
      FASTAPI_ENV: ${FASTAPI_ENV:-development}
      FASTAPI_DEBUG: ${FASTAPI_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DAGGER_WORKDIR: ${DAGGER_WORKDIR:-/tmp/dagger-work}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /tmp/dagger-work:/tmp/dagger-work
    command: python -m app.worker
    environment:
      PYTHONUNBUFFERED: 1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    container_name: shaheen-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
